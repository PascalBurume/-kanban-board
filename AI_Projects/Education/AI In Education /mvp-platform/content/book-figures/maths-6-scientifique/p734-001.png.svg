<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" role="img" aria-label="Cercle de Monge : l'ellipse, ses foyers et les familles de cercles centrés sur F et F prime dont les intersections décrivent l'ellipse">
  <rect width="580" height="520" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
    <line x1="20" y1="262" x2="558" y2="262"/>
    <path d="M558 262l-12-6M558 262l-12 6"/>
    <line x1="288" y1="500" x2="288" y2="18"/>
    <path d="M288 18l-6 12M288 18l6 12"/>
  </g>
  <!-- Les deux familles de cercles : rayons r depuis F et 2a − r depuis F′. Leurs
       intersections sont les points de l'ellipse — c'est cette construction, et
       non l'ellipse seule, que la figure démontre. -->
  <g fill="none" stroke="#999" stroke-width="0.9" stroke-dasharray="2 3">
    <circle cx="358" cy="262" r="45"/><circle cx="358" cy="262" r="80"/>
    <circle cx="358" cy="262" r="115"/><circle cx="358" cy="262" r="150"/>
    <circle cx="358" cy="262" r="185"/><circle cx="358" cy="262" r="220"/>
    <circle cx="218" cy="262" r="45"/><circle cx="218" cy="262" r="80"/>
    <circle cx="218" cy="262" r="115"/><circle cx="218" cy="262" r="150"/>
    <circle cx="218" cy="262" r="185"/><circle cx="218" cy="262" r="220"/>
  </g>
  <!-- Le cercle de Monge, de rayon √(a²+b²), centré à l'origine. -->
  <circle cx="288" cy="262" r="176" fill="none" stroke="#111" stroke-width="2.4" stroke-dasharray="9 6"/>
  <ellipse cx="288" cy="262" rx="150" ry="92" fill="none" stroke="#111" stroke-width="2.1"/>
  <g fill="#111">
    <circle cx="218" cy="262" r="3.4"/><circle cx="358" cy="262" r="3.4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">
    <text x="566" y="268">x</text>
    <text x="274" y="14">y</text>
    <text x="294" y="282">O</text>
    <text x="200" y="284">F′</text>
    <text x="350" y="284">F</text>
    <text x="404" y="96" font-style="italic">C</text>
  </g>
</svg>
