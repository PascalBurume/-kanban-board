<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" role="img" aria-label="Coordonnées polaires dans l'espace : le rayon rho vers P et les trois angles directeurs alpha, bêta et gamma">
  <rect width="540" height="440" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round">
    <line x1="215" y1="290" x2="215" y2="25"/>
    <path d="M215 25l-6 12M215 25l6 12"/>
    <line x1="215" y1="290" x2="500" y2="290"/>
    <path d="M500 290l-12-6M500 290l-12 6"/>
    <line x1="215" y1="290" x2="45" y2="425"/>
    <path d="M45 425l4-14M45 425l14-4"/>
  </g>
  <!-- OP = ρ, et le rectangle de base qui situe la projection de P. -->
  <line x1="215" y1="290" x2="345" y2="110" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="none" stroke="#111" stroke-width="1.3">
    <path d="M345 110V375"/>
    <path d="M215 290L345 375"/>
    <path d="M345 375L432 300"/>
    <path d="M155 375H345"/>
    <path d="M155 375L215 290"/>
  </g>
  <!-- γ depuis Oz, β depuis Oy, α depuis Ox. -->
  <path d="M215 205 A88 88 0 0 0 268 236" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M268 236l-13 0M268 236l-3-12" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M375 290 A160 160 0 0 0 262 240" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M262 240l12 4M262 240l-1 13" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M130 355 A140 140 0 0 0 268 268" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M268 268l-13 3M268 268l0 13" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="345" cy="110" r="3.4" fill="#111"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111">
    <text x="200" y="20">Z</text>
    <text x="508" y="296">Y</text>
    <text x="26" y="438">X</text>
    <text x="188" y="284">O</text>
    <text x="352" y="102" font-weight="700">P</text>
    <text x="262" y="180" font-style="italic">ρ</text>
    <text x="238" y="176" font-style="italic">γ</text>
    <text x="368" y="248" font-style="italic">β</text>
    <text x="262" y="330" font-style="italic">α</text>
  </g>
</svg>
