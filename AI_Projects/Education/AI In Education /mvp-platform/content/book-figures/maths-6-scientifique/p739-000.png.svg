<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Hyperbole : sommets A et A prime, foyers F et F prime, directrices d et d prime, et le rectangle des asymptotes">
  <rect width="600" height="320" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="20" y1="165" x2="580" y2="165"/>
    <path d="M580 165l-12-6M580 165l-12 6"/>
    <line x1="290" y1="20" x2="290" y2="310"/>
    <path d="M290 20l-6 12M290 20l6 12"/>
  </g>
  <!-- Le rectangle bâti sur a et b, et les deux directrices verticales. -->
  <rect x="185" y="80" width="210" height="170" fill="none" stroke="#111" stroke-width="1.4"/>
  <g fill="none" stroke="#111" stroke-width="1.4">
    <line x1="228" y1="42" x2="228" y2="292"/>
    <line x1="352" y1="42" x2="352" y2="292"/>
  </g>
  <!-- Les deux branches, ouvertes vers l'extérieur des sommets. -->
  <!-- Chaque branche a son sommet SUR A ou A′ et s'ouvre vers l'extérieur. -->
  <path d="M112 50 C 172 98, 185 138, 185 165 C 185 192, 172 232, 112 280" fill="none" stroke="#111" stroke-width="1.9"/>
  <path d="M468 50 C 408 98, 395 138, 395 165 C 395 192, 408 232, 468 280" fill="none" stroke="#111" stroke-width="1.9"/>
  <g fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round">
    <line x1="120" y1="165" x2="470" y2="95"/>
    <line x1="455" y1="165" x2="470" y2="95"/>
  </g>
  <g fill="#111">
    <circle cx="120" cy="165" r="3.2"/><circle cx="455" cy="165" r="3.2"/>
    <circle cx="185" cy="165" r="3.2"/><circle cx="395" cy="165" r="3.2"/>
    <circle cx="470" cy="95" r="3.4"/>
    <circle cx="290" cy="80" r="3"/><circle cx="290" cy="250" r="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111">
    <text x="588" y="171">x</text>
    <text x="276" y="16">y</text>
    <text x="264" y="184">O</text>
    <text x="62" y="186">F′(−c , 0)</text>
    <text x="150" y="186">A′(−a,0)</text>
    <text x="372" y="186">A(a,0)</text>
    <text x="430" y="186">F(c , 0)</text>
    <text x="254" y="72">B(0 , b)</text>
    <text x="250" y="270">B′(0 , −b)</text>
    <text x="340" y="36" font-weight="700">d</text>
    <text x="216" y="308" font-weight="700">d′</text>
    <text x="474" y="88">M(x , y)</text>
  </g>
</svg>
