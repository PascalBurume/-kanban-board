<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 480" role="img" aria-label="Appareil de Kipp pour la préparation du sulfure d'hydrogène : HCl dans le ballon supérieur, FeS au centre, FeCl2 au fond et dégagement de H2S">
  <rect width="340" height="480" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Tube d'alimentation et son robinet, en haut. -->
    <path d="M118 30q-6-14 6-16M148 30q6-14-6-16"/>
    <path d="M126 30h14v96h-14z"/>
    <path d="M140 60h22q10 0 10 12t-10 12h-22"/>
    <circle cx="160" cy="72" r="9"/>
    <!-- Le tube plongeur descend jusqu'au ballon inférieur. -->
    <path d="M129 126v250"/>
    <path d="M137 126v250"/>
    <!-- Ballon supérieur : l'acide. -->
    <path d="M126 138q-62 6-62 56t62 56"/>
    <path d="M140 138q62 6 62 56t-62 56"/>
    <path d="M112 250h42"/>
    <!-- Ballon central : le sulfure de fer, posé sur l'étranglement. -->
    <path d="M120 262q-56 6-56 52t56 56"/>
    <path d="M146 262q56 6 56 52t-56 56"/>
    <!-- Ballon inférieur : le chlorure formé. -->
    <path d="M108 372q-46 14-46 58t50 44h96q50-4 50-44t-46-58"/>
    <!-- Sortie latérale du gaz, avec son robinet. -->
    <path d="M186 322h64"/>
    <circle cx="182" cy="322" r="7" fill="#111"/>
    <path d="M250 310h20v24h-20z"/>
    <path d="M270 322h44"/>
    <path d="M314 322l-12-6M314 322l-12 6"/>
  </g>
  <!-- Le lit de FeS, figuré par des grains. -->
  <g fill="#111">
    <circle cx="96" cy="352" r="3"/><circle cx="112" cy="358" r="3"/><circle cx="130" cy="360" r="3"/>
    <circle cx="148" cy="358" r="3"/><circle cx="166" cy="352" r="3"/><circle cx="104" cy="344" r="3"/>
    <circle cx="158" cy="344" r="3"/><circle cx="122" cy="350" r="3"/><circle cx="140" cy="350" r="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111">
    <text x="14" y="200">HCl</text>
    <text x="10" y="368">FeS</text>
    <text x="176" y="432">FeCl₂</text>
    <text x="276" y="352">H₂S</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.2">
    <path d="M48 194h22"/><path d="M44 362h44"/><path d="M172 426l-24-16"/>
  </g>
</svg>
