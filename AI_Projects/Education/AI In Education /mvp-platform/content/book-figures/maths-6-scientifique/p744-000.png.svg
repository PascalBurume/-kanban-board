<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-label="Construction de l'hyperbole par cercles concentriques centrés sur les foyers F et F prime">
  <rect width="620" height="500" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
    <line x1="20" y1="250" x2="598" y2="250"/>
    <path d="M598 250l-12-6M598 250l-12 6"/>
    <line x1="310" y1="480" x2="310" y2="18"/>
    <path d="M310 18l-6 12M310 18l6 12"/>
  </g>
  <!-- Les cercles concentriques : depuis F de rayon r, depuis F′ de rayon r + 2a.
       Leurs intersections donnent les points de l'hyperbole — c'est la méthode
       que la section enseigne, et elle disparaîtrait si l'on ne gardait que les
       deux branches. -->
  <g fill="none" stroke="#aaa" stroke-width="0.85" stroke-dasharray="2 3">
    <circle cx="380" cy="250" r="40"/><circle cx="380" cy="250" r="75"/>
    <circle cx="380" cy="250" r="110"/><circle cx="380" cy="250" r="145"/>
    <circle cx="380" cy="250" r="180"/><circle cx="380" cy="250" r="215"/>
    <circle cx="240" cy="250" r="40"/><circle cx="240" cy="250" r="75"/>
    <circle cx="240" cy="250" r="110"/><circle cx="240" cy="250" r="145"/>
    <circle cx="240" cy="250" r="180"/><circle cx="240" cy="250" r="215"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" stroke-dasharray="9 6">
    <circle cx="240" cy="250" r="150"/><circle cx="380" cy="250" r="150"/>
  </g>
  <!-- Les asymptotes, puis les deux branches, sommets sur l'axe. -->
  <g fill="none" stroke="#111" stroke-width="1.2">
    <line x1="170" y1="380" x2="450" y2="120"/>
    <line x1="170" y1="120" x2="450" y2="380"/>
  </g>
  <path d="M198 128 C 258 178, 272 224, 272 250 C 272 276, 258 322, 198 372" fill="none" stroke="#111" stroke-width="2.6"/>
  <path d="M422 128 C 362 178, 348 224, 348 250 C 348 276, 362 322, 422 372" fill="none" stroke="#111" stroke-width="2.6"/>
  <g fill="#111">
    <circle cx="240" cy="250" r="3.6"/><circle cx="380" cy="250" r="3.6"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">
    <text x="606" y="256">x</text>
    <text x="296" y="14">y</text>
    <text x="316" y="272">O</text>
    <text x="222" y="274">F′</text>
    <text x="372" y="274">F</text>
    <text x="128" y="196" font-style="italic">C′</text>
    <text x="512" y="196" font-style="italic">C</text>
  </g>
</svg>
