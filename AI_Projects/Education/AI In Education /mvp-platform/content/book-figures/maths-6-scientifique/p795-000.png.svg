<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-label="Plan coupant les axes en A, B et C, avec la hauteur issue de C">
  <rect width="460" height="300" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="175" y1="205" x2="175" y2="40"/>
    <path d="M175 40l-6 12M175 40l6 12"/>
    <line x1="175" y1="205" x2="430" y2="205"/>
    <path d="M430 205l-12-6M430 205l-12 6"/>
    <line x1="175" y1="205" x2="60" y2="272"/>
    <path d="M60 272l5-12M60 272l12-5"/>
  </g>
  <!-- A, B and C are the intercepts, so each must sit ON its axis: A is the point
       of the x-axis at t = 0.7 along O→x, not merely near it. -->
  <g fill="none" stroke="#111" stroke-width="1.9" stroke-linejoin="round">
    <path d="M95 252L175 78L300 205Z"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="175" y1="78" x2="175" y2="205"/>
    <line x1="95" y1="252" x2="300" y2="205"/>
  </g>
  <g fill="#111">
    <circle cx="95" cy="252" r="3.4"/>
    <circle cx="300" cy="205" r="3.4"/>
    <circle cx="175" cy="78" r="3.4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111">
    <text x="161" y="34">z</text>
    <text x="438" y="211">y</text>
    <text x="40" y="285">x</text>
    <text x="70" y="266">A</text>
    <text x="303" y="226">B</text>
    <text x="182" y="70">C</text>
    <text x="152" y="199">O</text>
  </g>
</svg>
