<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-label="Relations entre coordonnées cartésiennes et polaires : le point P, sa projection K, et les points R et L sur les axes">
  <rect width="560" height="470" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round">
    <line x1="215" y1="300" x2="215" y2="25"/>
    <path d="M215 25l-6 12M215 25l6 12"/>
    <line x1="215" y1="300" x2="515" y2="300"/>
    <path d="M515 300l-12-6M515 300l-12 6"/>
    <line x1="215" y1="300" x2="45" y2="450"/>
    <path d="M45 450l4-14M45 450l14-4"/>
  </g>
  <!-- ρ = OP ; z relève K en P ; le rectangle ORKL donne x et y. -->
  <line x1="215" y1="300" x2="335" y2="105" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="none" stroke="#111" stroke-width="1.3">
    <path d="M335 105V385"/>
    <path d="M215 300L335 385"/>
    <path d="M335 385L430 300"/>
    <path d="M130 385H335"/>
    <path d="M130 385L215 300"/>
    <path d="M335 105L430 300"/>
  </g>
  <path d="M215 212 A88 88 0 0 0 262 246" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M262 246l-13 0M262 246l-3-12" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M372 300 A157 157 0 0 0 260 252" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M260 252l12 4M260 252l-1 13" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M118 368 A150 150 0 0 0 266 282" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M266 282l-13 3M266 282l0 13" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <g fill="#111"><circle cx="335" cy="105" r="3.4"/><circle cx="335" cy="385" r="3"/><circle cx="430" cy="300" r="3"/><circle cx="130" cy="385" r="3"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">
    <text x="201" y="20">z</text>
    <text x="523" y="306">y</text>
    <text x="26" y="463">x</text>
    <text x="188" y="294">O</text>
    <text x="342" y="98">P (x , y , z)</text>
    <text x="348" y="122" font-size="16">(ρ , α , β , γ)</text>
    <text x="340" y="408">K</text>
    <text x="436" y="294">L</text>
    <text x="106" y="380">R</text>
    <text x="256" y="176" font-style="italic">ρ</text>
    <text x="234" y="182" font-style="italic">γ</text>
    <text x="366" y="258" font-style="italic">β</text>
    <text x="256" y="342" font-style="italic">α</text>
    <text x="344" y="250" font-style="italic">z</text>
    <text x="222" y="404" font-style="italic">y</text>
    <text x="392" y="352" font-style="italic">x</text>
  </g>
</svg>
