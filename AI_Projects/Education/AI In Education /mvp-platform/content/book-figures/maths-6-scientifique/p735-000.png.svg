<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" role="img" aria-label="Ellipse : la tangente t et la normale n en un point, avec les rayons focaux issus de F et F prime">
  <rect width="560" height="370" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="20" y1="195" x2="545" y2="195"/>
    <line x1="270" y1="20" x2="270" y2="360"/>
  </g>
  <ellipse cx="270" cy="195" rx="200" ry="105" fill="none" stroke="#111" stroke-width="1.8"/>
  <!-- Les deux rayons focaux aboutissent au même point de l'ellipse ; la normale
       n y partage leur angle, la tangente t lui est perpendiculaire. -->
  <g fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
    <line x1="130" y1="195" x2="430" y2="128"/>
    <line x1="390" y1="195" x2="430" y2="128"/>
    <line x1="352" y1="240" x2="520" y2="35"/>
    <line x1="345" y1="55" x2="500" y2="245"/>
  </g>
  <g fill="#111">
    <circle cx="430" cy="128" r="3.4"/><circle cx="130" cy="195" r="3.2"/><circle cx="390" cy="195" r="3.2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111">
    <text x="112" y="218">F′</text>
    <text x="382" y="218">F</text>
    <text x="248" y="218">O</text>
    <text x="524" y="30" font-style="italic">n</text>
    <text x="504" y="258" font-style="italic">t</text>
  </g>
</svg>
