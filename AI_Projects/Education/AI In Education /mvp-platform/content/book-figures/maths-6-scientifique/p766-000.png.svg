<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" role="img" aria-label="Symétrie orthogonale par rapport à la droite d : M et son image M prime, la perpendiculaire p et leur point commun I">
  <rect width="540" height="380" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="25" y1="280" x2="500" y2="280"/>
    <path d="M500 280l-12-6M500 280l-12 6"/>
    <line x1="150" y1="365" x2="150" y2="20"/>
    <path d="M150 20l-6 12M150 20l6 12"/>
  </g>
  <!-- d, l'axe de la symétrie ; p, la perpendiculaire portant M et son image. -->
  <line x1="215" y1="60" x2="470" y2="180" fill="none" stroke="#111" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="300" y1="220" x2="400" y2="35" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <g fill="#111">
    <circle cx="352" cy="119" r="3.4"/>
    <circle cx="310" cy="197" r="3.4"/>
    <circle cx="394" cy="46" r="3.4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111">
    <text x="508" y="300">x</text>
    <text x="136" y="16">y</text>
    <text x="126" y="302">O</text>
    <text x="222" y="52" font-weight="700">d</text>
    <text x="366" y="42" font-style="italic">p</text>
    <text x="326" y="132" font-style="italic">I</text>
    <text x="318" y="216">M(x₀ , y₀)</text>
    <text x="402" y="40">M′(x₀′ , y₀′)</text>
  </g>
</svg>
