<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Coordonnées cylindriques : le point P, sa projection K dans le plan xOy, le rayon rho et les angles phi et gamma">
  <rect width="520" height="440" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round">
    <line x1="185" y1="270" x2="185" y2="25"/>
    <path d="M185 25l-6 12M185 25l6 12"/>
    <line x1="185" y1="270" x2="490" y2="270"/>
    <path d="M490 270l-12-6M490 270l-12 6"/>
    <line x1="185" y1="270" x2="45" y2="415"/>
    <path d="M45 415l4-14M45 415l14-4"/>
  </g>
  <!-- OP et sa projection OK dans le plan xOy ; K se relève verticalement en P. -->
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="185" y1="270" x2="330" y2="160"/>
    <line x1="185" y1="270" x2="330" y2="360"/>
    <line x1="330" y1="360" x2="330" y2="160"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="330" y1="360" x2="105" y2="360"/>
    <line x1="330" y1="360" x2="430" y2="290"/>
  </g>
  <!-- γ mesuré depuis Oz, φ depuis Ox dans le plan de base. -->
  <path d="M185 190 A80 80 0 0 0 245 218" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M245 218l-13-1M245 218l-4-12" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M120 325 A85 85 0 0 0 240 318" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M240 318l-13 2M240 318l-9-10" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  <g fill="#111">
    <circle cx="330" cy="160" r="3.4"/><circle cx="330" cy="360" r="3.4"/>
    <circle cx="105" cy="360" r="3"/><circle cx="430" cy="290" r="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111">
    <text x="171" y="20">z</text>
    <text x="498" y="276">y</text>
    <text x="30" y="432">x</text>
    <text x="161" y="264">O</text>
    <text x="337" y="152">P</text>
    <text x="337" y="384">K</text>
    <text x="270" y="248" font-style="italic">ρ</text>
    <text x="92" y="384">Q</text>
    <text x="436" y="284">L</text>
    <text x="196" y="232" font-style="italic">γ</text>
    <text x="200" y="316" font-style="italic">φ</text>
  </g>
</svg>
