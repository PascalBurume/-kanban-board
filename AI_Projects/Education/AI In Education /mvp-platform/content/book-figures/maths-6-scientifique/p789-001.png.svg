<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-label="Repère de l'espace gradué portant les points A(1,2,3), B(-3,2,-1) et C(0,1,5)">
  <rect width="560" height="470" fill="white"/>
  <!-- Repère gradué : une unité vaut 45 px sur Oy, 40 px sur Oz, et le pas
       oblique (−30, +22) sur Ox. Les trois points sont placés avec ces pas, pour
       qu'ils tombent exactement sur les graduations. -->
  <g fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round">
    <line x1="250" y1="345" x2="250" y2="30"/>
    <path d="M250 30l-6 12M250 30l6 12"/>
    <line x1="250" y1="330" x2="515" y2="330"/>
    <path d="M515 330l-12-6M515 330l-12 6"/>
    <line x1="250" y1="330" x2="70" y2="462"/>
    <path d="M70 462l4-14M70 462l14-4"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.1">
    <path d="M295 325v10M340 325v10M385 325v10M430 325v10M475 325v10"/>
    <path d="M245 290h10M245 250h10M245 210h10M245 170h10M245 130h10"/>
    <path d="M216 356l8 6M186 378l8 6M156 400l8 6M126 422l8 6"/>
  </g>
  <!-- Chaque point est rattaché au plan de base par une verticale pointillée. -->
  <g fill="none" stroke="#111" stroke-width="1.1" stroke-dasharray="3 3">
    <path d="M310 232V352"/><path d="M310 352L340 330"/>
    <path d="M295 130V330"/>
    <path d="M430 304V264"/><path d="M430 264L340 330"/>
  </g>
  <g fill="#111">
    <circle cx="310" cy="232" r="3.6"/>
    <circle cx="430" cy="304" r="3.6"/>
    <circle cx="295" cy="130" r="3.6"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">
    <text x="236" y="26">Z</text>
    <text x="523" y="336">Y</text>
    <text x="52" y="466">X</text>
    <text x="226" y="352">O</text>
    <text x="222" y="136">5</text>
    <text x="318" y="226">A(1 , 2 , 3)</text>
    <text x="438" y="300">B(−3 , 2 , −1)</text>
    <text x="258" y="122">C(0 , 1 , 5)</text>
  </g>
</svg>
