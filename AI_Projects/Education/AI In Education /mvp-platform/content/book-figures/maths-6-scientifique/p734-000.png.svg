<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Construction paramétrique de l'ellipse à partir des cercles de rayons a et b et de l'angle alpha">
  <rect width="520" height="400" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="25" y1="200" x2="500" y2="200"/>
    <path d="M500 200l-12-6M500 200l-12 6"/>
    <line x1="255" y1="382" x2="255" y2="18"/>
    <path d="M255 18l-6 12M255 18l6 12"/>
  </g>
  <!-- Circles of radius a and b, and the ellipse they generate. -->
  <circle cx="255" cy="200" r="155" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="255" cy="200" r="98" fill="none" stroke="#111" stroke-width="1.5"/>
  <ellipse cx="255" cy="200" rx="155" ry="98" fill="none" stroke="#111" stroke-width="1.9"/>
  <!-- The ray at angle alpha meets the big circle; M is read off at x = a cos α, y = b sin α. -->
  <line x1="255" y1="200" x2="388" y2="121" fill="none" stroke="#111" stroke-width="1.6"/>
  <line x1="388" y1="121" x2="388" y2="200" fill="none" stroke="#111" stroke-width="1.4"/>
  <path d="M312 200 A57 57 0 0 0 300 168" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M388 188h-12v12" fill="none" stroke="#111" stroke-width="1.2"/>
  <g fill="#111">
    <circle cx="388" cy="121" r="3.4"/>
    <circle cx="255" cy="102" r="3.4"/><circle cx="255" cy="298" r="3.4"/>
    <circle cx="100" cy="200" r="3.4"/><circle cx="410" cy="200" r="3.4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">
    <text x="508" y="220">x</text>
    <text x="241" y="14">y</text>
    <text x="228" y="222">O</text>
    <text x="262" y="96">B</text>
    <text x="262" y="318">B′</text>
    <text x="84" y="224">A′</text>
    <text x="414" y="224">A</text>
    <text x="396" y="112">M(x , y)</text>
    <text x="318" y="186" font-style="italic">α</text>
  </g>
</svg>
