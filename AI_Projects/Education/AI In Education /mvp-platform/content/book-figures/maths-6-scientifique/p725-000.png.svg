<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-label="Parabole : la tangente t en P est la bissectrice de l'angle formé par le rayon focal PF et la parallèle à l'axe">
  <rect width="540" height="360" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="20" y1="215" x2="510" y2="215"/>
    <path d="M510 215l-12-6M510 215l-12 6"/>
    <line x1="175" y1="345" x2="175" y2="18"/>
    <path d="M175 18l-6 12M175 18l6 12"/>
  </g>
  <!-- Directrice, à gauche du sommet ; F le foyer, symétrique par rapport à O. -->
  <line x1="110" y1="35" x2="110" y2="330" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M245 35 C 150 130, 150 300, 245 345" fill="none" stroke="#111" stroke-width="1.9"/>
  <!-- Le rayon focal FP, la parallèle à l'axe menée par P, et la tangente t qui
       partage leur angle en deux. -->
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="240" y1="215" x2="380" y2="118"/>
    <line x1="175" y1="118" x2="470" y2="118"/>
    <line x1="60" y1="243" x2="452" y2="62"/>
  </g>
  <g fill="#111">
    <circle cx="380" cy="118" r="3.6"/><circle cx="240" cy="215" r="3.4"/>
    <circle cx="110" cy="215" r="3.4"/><circle cx="142" cy="215" r="3.4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">
    <text x="518" y="235">x</text>
    <text x="161" y="14">y</text>
    <text x="180" y="238">O</text>
    <text x="100" y="238">S</text>
    <text x="134" y="238">R</text>
    <text x="234" y="238">F</text>
    <text x="330" y="106">P(x₁ , y₁)</text>
    <text x="458" y="60" font-style="italic">t</text>
  </g>
</svg>
