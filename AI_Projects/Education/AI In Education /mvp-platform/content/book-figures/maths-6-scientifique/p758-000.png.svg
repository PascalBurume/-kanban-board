<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 370" role="img" aria-label="Homothétie de centre C : les points C, M et M prime alignés, avec leurs coordonnées projetées sur les axes">
  <rect width="500" height="370" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="35" y1="310" x2="465" y2="310"/>
    <path d="M465 310l-12-6M465 310l-12 6"/>
    <line x1="105" y1="352" x2="105" y2="25"/>
    <path d="M105 25l-6 12M105 25l6 12"/>
  </g>
  <!-- C, M and M' are collinear — that is the whole content of the figure. -->
  <line x1="196" y1="272" x2="430" y2="132" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="none" stroke="#111" stroke-width="1.1" stroke-dasharray="3 4">
    <path d="M240 246V310M240 246H105"/>
    <path d="M310 204V310M310 204H105"/>
    <path d="M380 162V310M380 162H105"/>
  </g>
  <g fill="#111">
    <circle cx="240" cy="246" r="3.4"/><circle cx="310" cy="204" r="3.4"/><circle cx="380" cy="162" r="3.4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111">
    <text x="473" y="316">x</text>
    <text x="91" y="20">y</text>
    <text x="84" y="332">O</text>
    <text x="233" y="332" font-style="italic">α</text>
    <text x="304" y="332" font-style="italic">x</text>
    <text x="371" y="332" font-style="italic">x′</text>
    <text x="80" y="252" font-style="italic">β</text>
    <text x="82" y="210" font-style="italic">y</text>
    <text x="76" y="168" font-style="italic">y′</text>
    <text x="216" y="270">C(α , β)</text>
    <text x="292" y="228">M(x , y)</text>
    <text x="386" y="186">M′(x′ , y′)</text>
  </g>
</svg>
